<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · Registro de tareas</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #f6f7f9;
        color: #16202c;
        font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .caja {
        max-width: 26rem;
        text-align: center;
      }
      .icono {
        width: 64px;
        height: 64px;
        margin: 0 auto 1.25rem;
        display: block;
      }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
      p { margin: 0 0 0.75rem; color: #475569; }
      button {
        margin-top: 0.75rem;
        padding: 0.75rem 1.25rem;
        border: 0;
        border-radius: 0.5rem;
        background: #1d4ed8;
        color: #fff;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="caja">
      <img class="icono" src="/icono/icono-192.png" alt="" />
      <h1>Sin conexión</h1>
      <p>
        Esta app necesita señal para leer y guardar las planillas. No se perdió
        nada de lo que ya habías cargado.
      </p>
      <p>Buscá un lugar con señal y volvé a intentar.</p>
      <button onclick="location.reload()">Reintentar</button>
    </div>
  </body>
</html>
